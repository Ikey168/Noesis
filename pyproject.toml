[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "noesis-evidence"
version = "0.1.0"
description = "Local-first, verifiable evidence infrastructure for agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Noesis contributors"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "duckdb>=1.0,<2.0",
  "fastavro>=1.12,<2.0",
  "jsonschema>=4.23,<5.0",
  "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
# Small, independently installable integration profiles; no paid credentials or
# model weights are downloaded by package installation. Heavy runtimes may use
# NOESIS_OPTIONAL_PYTHON_<BACKEND> to isolate incompatible Python/SDK versions.
optional-runtime = ["psutil==7.2.2", "numpy>=2.1,<3", "httpx==0.28.1"]
optional-sources = ["httpx==0.28.1", "defusedxml==0.7.1", "beautifulsoup4>=4.12,<5", "lxml>=5,<7", "PyMuPDF==1.28.2", "mcp==1.28.1"]
optional-linkage = ["splink==4.0.17", "rapidfuzz==3.14.3", "datasketch==2.0.0"]
optional-language = ["lingua-language-detector==2.2.0"]
optional-ragas = ["ragas==0.4.3", "langchain-community==0.3.31"]
optional-tracing = ["opentelemetry-sdk==1.44.0", "opentelemetry-exporter-otlp-proto-http==1.44.0"]
optional-conversion = ["markitdown==0.1.7", "mammoth==1.11.0", "python-docx==1.2.0", "python-pptx==1.0.2", "openpyxl==3.1.5"]
optional-redaction = ["presidio-analyzer==2.2.364", "spacy==3.8.16"]
optional-bge = ["FlagEmbedding==1.4.2", "transformers>=4.44.2,<6"]
optional-gliner = ["gliner2[local]==2.0.0"]
optional-sat = ["wtpsplit==2.2.1"]
optional-outlines = ["outlines[transformers]==1.3.3", "llguidance==1.8.0"]
optional-whisperx = ["whisperx==3.8.6"]
optional-paddle = ["paddleocr==3.7.0", "paddlepaddle==3.3.1"]
optional-docling = ["docling==2.126.0"]
optional-zyte = ["scrapy-zyte-api==0.36.0"]
archives = ["warcio==1.8.1"]
unit-evaluation = ["pint==0.25.2"]
report-rendering = ["pypandoc_binary==1.17", "typst==0.15.0"]
drift-evaluation = ["river==0.26.1"]
dataset-validation = ["pandera[pandas]==0.33.1"]
ingestion = [
  "defusedxml>=0.7.1,<1",
  "feedparser>=6,<7",
  "beautifulsoup4>=4.12",
  "trafilatura>=1.8,<3",
  "readability-lxml>=0.8.1,<1",
  "extruct>=0.18,<1",
]
browser = [
  "scrapy>=2.17,<3",
  "scrapy-playwright>=0.0.46,<1",
  "playwright>=1.40,<2",
  "aiohttp>=3.9,<4",
  "aiofiles>=23",
  "psutil>=5.9",
  "beautifulsoup4>=4.12",
]
evaluation = ["ir-measures==0.4.3"]
bibliography = [
  "pyzotero>=1.15.1,<1.16",
  "bibtexparser>=1.4.4,<2.0",
]
minimal = []
server = [
  "fastapi>=0.109.1,<1.0",
  "fastmcp>=2.0,<3.0",
  "mcp>=1.28.1,<2.0",
  "uvicorn>=0.23,<1.0",
]
models = [
  "huggingface-hub>=0.20,<2.0",
  "sentence-transformers>=2.0",
  "torch>=2.0",
  "transformers>=5.13",
]
vector = [
  "psycopg2-binary>=2.9.12",
  "qdrant-client>=1.7,<2.0",
]
media = [
  "beautifulsoup4>=4.12",
  "ebooklib>=0.18",
  "lxml>=5.0",
  "pdf2image>=1.17",
  "pdfminer.six>=20221105",
  "Pillow>=10.0",
  "PyMuPDF>=1.24",
  "pytesseract>=0.3.10",
]
orchestration = [
  "apache-airflow>=2.8,<4.0",
  "apscheduler>=3.10,<4.0",
  "dbt-core>=1.7,<2.0",
  "mlflow>=2.0,<4.0",
]
cloud = [
  "boto3>=1.26",
  "botocore>=1.29",
  "redis>=5.0",
]
full = [
  "apache-airflow>=2.8,<4.0",
  "apscheduler>=3.10,<4.0",
  "beautifulsoup4>=4.12",
  "boto3>=1.26",
  "botocore>=1.29",
  "dbt-core>=1.7,<2.0",
  "ebooklib>=0.18",
  "fastapi>=0.109.1,<1.0",
  "fastmcp>=2.0,<3.0",
  "huggingface-hub>=0.20,<2.0",
  "lxml>=5.0",
  "mcp>=1.28.1,<2.0",
  "mlflow>=2.0,<4.0",
  "pdf2image>=1.17",
  "pdfminer.six>=20221105",
  "Pillow>=10.0",
  "psycopg2-binary>=2.9.12",
  "PyMuPDF>=1.24",
  "pytesseract>=0.3.10",
  "qdrant-client>=1.7,<2.0",
  "redis>=5.0",
  "sentence-transformers>=2.0",
  "torch>=2.0",
  "transformers>=5.13",
  "uvicorn>=0.23,<1.0",
]

[project.scripts]
noesis = "src.noesis_cli.app:main"
noesis-optional = "src.noesis_cli.optional:main"

[project.urls]
Homepage = "https://github.com/Ikey168/Noesis"
Issues = "https://github.com/Ikey168/Noesis/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["contracts*", "src*", "services*", "tools*"]
namespaces = true

[tool.setuptools.package-data]
"contracts.schemas.avro" = ["*.avsc"]
"contracts.schemas.jsonschema" = ["*.json"]
"src.noesis_cli" = ["resources/*"]
