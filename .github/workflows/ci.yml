name: CI
# Auto-run disabled: superseded by the main CI/CD pipeline (ci-cd-pipeline.yml).
# Kept as a valid, manual-dispatch-only workflow so it no longer produces
# startup-failure runs on every push and pull request.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          gfortran \
          libopenblas-dev \
          liblapack-dev \
          pkg-config
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip wheel setuptools
        # Install numpy first to avoid compilation issues
        pip install numpy
        # Install pre-compiled packages when available
        pip install --only-binary=scipy,scikit-learn scipy scikit-learn
        pip install -e .
        pip install pytest pytest-asyncio pytest-cov
        pip install -r requirements.txt
        
    - name: Download NLTK data and spaCy models
      run: |
        python -c "import nltk; nltk.download('punkt'); nltk.download('stopwords'); nltk.download('averaged_perceptron_tagger')"
        python -m spacy download en_core_web_sm || echo "spaCy model download failed, tests will use fallback"
        
    - name: Run tests
      env:
        NEPTUNE_ENDPOINT: "ws://mock-neptune:8182/gremlin"
      run: |
        pytest --ignore=tests/test_ner.py

