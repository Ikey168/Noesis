name: Airflow DAG Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dag-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AIRFLOW_HOME: ${{ github.workspace }}/.airflow_home
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__UNIT_TEST_MODE: "True"
      AIRFLOW__OPENLINEAGE__DISABLED: "True"
      MLFLOW_DISABLED: "true"
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/airflow/plugins
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install the production Airflow runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r airflow/requirements.txt \
            --constraint https://raw.githubusercontent.com/apache/airflow/constraints-3.3.1/constraints-3.11.txt
          pip install "apache-airflow==3.3.1" ".[ingestion]" pytest pyarrow
          pip check
          airflow version
      - name: Initialize Airflow metadata DB
        run: airflow db migrate
      - name: Run DAG import and serialization tests
        run: python -m pytest -q tests/dags
