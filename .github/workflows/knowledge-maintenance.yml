name: Knowledge maintenance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/kb/maintenance.py"
      - "src/kb/unified_query.py"
      - "src/ingestion/source_pack_runtime.py"
      - "src/mcp_host/catalog.py"
      - "tools/knowledge_engine_mcp/**"
      - "scripts/knowledge_maintenance_*.py"
      - "tests/unit/kb/test_maintenance.py"
      - "tests/unit/tools/test_knowledge_maintenance_mcp.py"
      - "contracts/schemas/jsonschema/noesis-maintenance-*.json"
      - "contracts/schemas/jsonschema/noesis-knowledge-generation-v1.json"
      - "contracts/generated/noesis-mcp-catalog-v1.json"
      - ".github/workflows/knowledge-maintenance.yml"
  push:
    branches: [main]
    paths:
      - "src/kb/maintenance.py"
      - "src/kb/unified_query.py"
      - "src/ingestion/source_pack_runtime.py"
      - "tools/knowledge_engine_mcp/**"
      - "scripts/knowledge_maintenance_*.py"
      - "tests/unit/kb/test_maintenance.py"
      - ".github/workflows/knowledge-maintenance.yml"

permissions:
  contents: read

jobs:
  offline-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[server]" pytest jsonschema ruff
      - name: Lint the maintenance surface
        run: >-
          ruff check src/kb/maintenance.py src/kb/unified_query.py
          src/ingestion/source_pack_runtime.py src/mcp_host/catalog.py
          tools/knowledge_engine_mcp/server.py scripts/knowledge_maintenance_worker.py
          scripts/knowledge_maintenance_reference.py tests/unit/kb/test_maintenance.py
          tests/unit/tools/test_knowledge_maintenance_mcp.py
      - name: Exercise leases, recovery, visibility, replay, and MCP controls
        run: >-
          pytest -q tests/unit/kb/test_maintenance.py
          tests/unit/tools/test_knowledge_maintenance_mcp.py
          tests/unit/mcp_host/test_catalog.py
      - name: Run all-six-domain source-to-query fixture
        run: make knowledge-maintenance-check
      - name: Verify generated MCP catalog is current
        run: |
          python scripts/generate_mcp_catalog.py
          git diff --exit-code -- contracts/generated/noesis-mcp-catalog-v1.json
