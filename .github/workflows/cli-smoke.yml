name: Noesis CLI fresh-install smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "pyproject.toml"
      - "noesis"
      - "src/noesis_cli/**"
      - "src/evidence_bundle/**"
      - "src/kb/**"
      - "src/ingestion/**"
      - "src/integrations/**"
      - "tests/unit/integrations/**"
      - "services/ingest/**"
      - "contracts/**"
      - "examples/quickstart/**"
      - "tests/unit/cli/**"
      - ".github/workflows/cli-smoke.yml"
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "noesis"
      - "src/noesis_cli/**"
      - "contracts/**"
      - "tests/unit/cli/**"

jobs:
  fresh-install:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[minimal]"
      - name: Exercise local journey outside the checkout
        run: |
          workspace="$(mktemp -d)"
          cd "$workspace"
          noesis init --non-interactive --json
          noesis doctor --json
          noesis ingest "$GITHUB_WORKSPACE/examples/quickstart/moon-mission.md" --domain local --json
          noesis ask "What was the mission result?" --domain local --format json
          noesis export answer --domain local --question "What was the mission result?" --include-private --output answer.bundle.json --json
          noesis verify answer.bundle.json --json
          noesis serve --surface api --dry-run --json

  extras-resolve:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        extra: [minimal, ingestion, browser, server, models, vector, media, orchestration, cloud, full, workflow-integrations, workflow-models, workflow-entities, workflow-export-validation]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          # Lingua 2.2.0 wheels require Python 3.12 or later.
          python-version: ${{ matrix.extra == 'workflow-integrations' && '3.12' || '3.11' }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --dry-run ".[${{ matrix.extra }}]"

  ingestion-browser-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip wheel --no-deps . -w dist
      - run: python -m pip install "$(find dist -name '*.whl' -print -quit)[ingestion,browser]"
      - run: python -m playwright install --with-deps chromium
      - name: Parse a feed, extract HTML and close Chromium outside checkout
        run: |
          cd "$(mktemp -d)"
          python - <<'PY'
          import asyncio
          import feedparser
          from src.ingestion.extract import extract_article
          from src.ingestion.connectors.paper.full_text import parse_jats
          from playwright.async_api import async_playwright
          assert feedparser.parse('<rss><channel><item><title>Example</title></item></channel></rss>').entries
          result = extract_article('<article><h1>Example</h1><p>' + 'A sentence of evidence. ' * 40 + '</p></article>')
          assert result and result.metadata['snapshot_sha256']
          assert 'Evidence' in parse_jats(b'<article><body><sec><title>Results</title><p>Evidence</p></sec></body></article>')['text']
          async def check():
              async with async_playwright() as p:
                  browser = await p.chromium.launch()
                  page = await browser.new_page()
                  await page.set_content('<article>Ready</article>')
                  await page.wait_for_selector('article')
                  await page.close()
                  await browser.close()
          asyncio.run(check())
          PY

  workflow-integrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install ".[workflow-integrations]" pytest ruff
      - run: python -m pytest -q tests/unit/integrations tests/unit/kb/test_source_planner.py
      - run: ruff check src/integrations tests/unit/integrations
      - name: Check packaged model registry outside checkout
        run: |
          cd "$(mktemp -d)"
          python - <<'PYCODE'
          from src.integrations.models import pin
          assert len(pin("intfloat/multilingual-e5-small")["revision"]) == 40
          PYCODE
