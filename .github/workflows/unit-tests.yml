name: Unit Tests

# Gates the capability plane (src/ + tools/) with the unit suites that were
# previously never run in CI (issue #818). Cheap KB, foundation-graph and MCP
# contract suites are part of the required lane; dependency-heavy end-to-end
# suites run on the scheduled full lane.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tools/**"
      - "services/**"
      - "contracts/**"
      - "tests/**"
      - "requirements*.txt"
      - ".github/workflows/unit-tests.yml"
  pull_request:
    paths:
      - "src/**"
      - "tools/**"
      - "services/**"
      - "contracts/**"
      - "tests/**"
      - "requirements*.txt"
      - ".github/workflows/unit-tests.yml"

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/workflows/unit-tests.yml

      - name: Install test dependencies
        # Curated set: everything the gated suites import, verified by a
        # collection triage. Deliberately not `-r requirements.txt` (which
        # pulls the full ML/warehouse stack) — widen alongside the scope.
        run: |
          python -m pip install --upgrade pip
          pip install \
            pytest pytest-asyncio \
            duckdb jsonschema \
            Pillow numpy pandas scikit-learn \
            fastapi httpx uvicorn \
            aiofiles psutil requests \
            fastavro beautifulsoup4 lxml \
            'fastmcp>=2.0,<3.0' pyyaml pyarrow huggingface_hub apscheduler

      - name: Verify immutable model pins
        run: python -m src.argument_mining.fetch_models --check

      - name: Run unit tests (capability plane)
        run: |
          python -m pytest \
            tests/unit/agent \
            tests/unit/alerts \
            tests/unit/analytics \
            tests/unit/app \
            tests/unit/argument_mining \
            tests/unit/config \
            tests/unit/domains \
            tests/unit/handlers \
            tests/unit/ingestion \
            tests/unit/kb \
            tests/unit/logging \
            tests/unit/mcp_host \
            tests/unit/ml \
            tests/unit/monitoring \
            tests/unit/osint \
            tests/unit/provisioning \
            tests/unit/reports \
            tests/unit/scraper_adaptive \
            tests/unit/services_api \
            tests/unit/tools \
            tests/unit/knowledge_graph \
            tests/knowledge_graph/test_claim_extraction.py \
            tests/knowledge_graph/test_entity_corrections.py \
            tests/knowledge_graph/test_entity_resolution.py \
            tests/knowledge_graph/test_kg_foundation.py \
            tests/knowledge_graph/test_kg_persistence.py \
            tests/knowledge_graph/test_kg_updater.py \
            -q
